name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      probe:
        description: "Nur Pakete bauen (Version 0.0.0-probe), nichts veröffentlichen"
        type: boolean
        default: true
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bibliotheken für den Starttest
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 >/dev/null
      - name: Probe-Build
        if: github.event_name == 'workflow_dispatch' && inputs.probe
        run: ./packaging/build-all.sh 0.0.0-probe
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.probe
        with:
          name: probe-pakete
          path: dist/*
      - name: semantic-release
        if: github.event_name == 'push' || !inputs.probe
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >
          npx -y -p semantic-release@24 -p @semantic-release/exec@6 -p @semantic-release/github@11
          -p conventional-changelog-conventionalcommits@8 semantic-release
