name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pakete:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Version
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then V="${GITHUB_REF_NAME#v}"; else V="$(cat VERSION)"; fi
          [ "${GITHUB_REF_TYPE}" != tag ] || [ "$V" = "$(cat VERSION)" ] || { echo "Tag $V passt nicht zu VERSION"; exit 1; }
          echo "V=$V" >> "$GITHUB_ENV"
      - run: ./packaging/build-deb.sh "$V"
      - run: ./packaging/build-appimage.sh "$V"
      - name: AppImage startet (ohne Bildschirm)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 >/dev/null
          cd build/appimage/AppDir
          QT_QPA_PLATFORM=offscreen timeout 8 ./AppRun || [ $? -eq 124 ]
      - name: deb-Inhalt
        run: dpkg-deb -c dist/*.deb && dpkg-deb -I dist/*.deb
      - run: cd dist && sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: pakete-${{ env.V }}
          path: dist/*
      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Tonie-Aufnahme $V" --notes-file packaging/release-notes.md
